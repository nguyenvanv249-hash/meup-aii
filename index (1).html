<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--p:#5b4be0;--p2:#7c5ce6;--y:#ffd23f;--bg:#f4f2ff;--ink:#1f1b3a;--mut:#6b6788;--ok:#1f9d63}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(160deg,#6d4fe0,#8b5cf0 45%,#c9b8ff);background-attachment:fixed;color:var(--ink);min-height:100vh}
#app{max-width:480px;margin:0 auto;padding:16px 16px 96px}
h1{color:#fff;font-size:26px;margin:12px 0 14px}
.card{background:#fff;border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 6px 20px rgba(40,20,120,.15)}
input,textarea{width:100%;border:0;border-radius:16px;padding:14px;font:inherit;background:#fff;color:var(--ink);outline:none}
textarea{min-height:90px;resize:vertical;border:2px solid #e5e0ff}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:14px;font:inherit;font-weight:700;background:var(--p);color:#fff;cursor:pointer;margin-top:10px}
.btn.alt{background:#ece8ff;color:var(--p)}.btn.ghost{background:none;color:var(--mut);font-weight:600}
.btn:disabled{opacity:.5}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.chip{white-space:nowrap;background:#fff;border-radius:999px;padding:8px 14px;font-weight:700;color:var(--p);border:2px solid transparent;cursor:pointer}
.chip.on{border-color:var(--p);background:#ece8ff}
.les{display:flex;gap:12px;align-items:center;cursor:pointer}
.emo{font-size:34px;width:60px;height:60px;border-radius:16px;background:#ece8ff;display:grid;place-items:center;flex:none}
.les b{display:block}.les small{color:var(--mut)}
.tag{font-size:11px;background:var(--y);border-radius:999px;padding:2px 8px;font-weight:800;margin-left:6px}
nav{position:fixed;left:0;right:0;bottom:0;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
nav div{display:flex;max-width:456px;width:100%;background:#fff;border-radius:24px;box-shadow:0 6px 24px rgba(0,0,0,.2)}
nav button{flex:1;border:0;background:none;padding:12px 2px;font-size:12px;-webkit-tap-highlight-color:transparent;font:inherit;font-weight:700;color:#a49fc4;cursor:pointer}
nav button.on{color:var(--p)}
.bar{display:flex;gap:4px;margin:8px 0 14px}.bar i{flex:1;height:5px;border-radius:9px;background:rgba(255,255,255,.4)}.bar i.on{background:#fff}
.top{display:flex;align-items:center;gap:10px;color:#fff}.x{border:0;background:#fff;border-radius:50%;width:34px;height:34px;font-weight:800;cursor:pointer}
.tagq{display:inline-block;font-size:12px;background:#ece8ff;color:var(--p);padding:3px 10px;border-radius:9px;margin-bottom:10px;font-weight:700}
.opt{display:block;width:100%;text-align:left;background:#f6f4ff;border:2px solid transparent;border-radius:14px;padding:12px;margin-top:8px;font:inherit;cursor:pointer;color:var(--ink)}
.opt.sel{border-color:var(--p)}.opt.good{border-color:var(--ok);background:#e6f8ef}.opt.bad{border-color:#d9534f;background:#fdeceb}
.fb{background:#e6f8ef;border-radius:14px;padding:12px;margin-top:12px;font-size:14px;line-height:1.5}.fb b{color:var(--ok)}
.blank{display:inline-block;min-width:80px;border-bottom:2px dashed var(--p);text-align:center;color:var(--p);font-weight:800}
.orb{width:84px;height:84px;border-radius:50%;margin:16px auto;background:radial-gradient(circle at 35% 30%,#a99cff,#5b4be0);display:flex;gap:12px;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(91,75,224,.5)}
.orb i{width:10px;height:16px;background:#111;border-radius:9px}
.bub{background:#fff;border-radius:18px;padding:14px;margin-bottom:10px;line-height:1.5;white-space:pre-wrap}
.bub.me{background:#ece8ff;margin-left:30px}
.c{text-align:center}.big{font-size:40px;font-weight:800;color:var(--p)}
.mut{color:var(--mut);font-size:14px}.wh{color:#fff}
.star{position:absolute;top:8px;right:10px;border:0;background:none;font-size:26px;cursor:pointer;color:#f5a623;-webkit-tap-highlight-color:transparent}</style></head><body><div id="app"></div>
<nav><div><button id="n0" onclick="go('home')">🧭 Khám phá</button><button id="n1" onclick="go('gen')">✨ Tạo bài</button><button id="n3" onclick="go('habit')">🌱 Thói quen</button><button id="n4" onclick="go('favs')">⭐ Đã lưu</button><button id="n2" onclick="go('prog')">📈 Tiến độ</button></div></nav>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let LS={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const BASE=[
{id:'b1',emo:'🧠',title:'Ngừng chỉ đọc, hãy bắt đầu nhớ lại',topic:'Học tập',cards:[
{t:'info',x:'Đọc đi đọc lại tạo cảm giác quen thuộc, nhưng không phải là nhớ. Tự cố gắng nhớ lại (active recall) mới giúp kiến thức ở lại lâu.'},
{t:'fill',q:'Ai cũng có 24 giờ mỗi ngày, nhưng ___ mới quyết định bạn làm được gì.',o:['thời gian','năng lượng','tiền bạc'],a:1,e:'Thời gian ai cũng như nhau, nên thứ tạo khác biệt là năng lượng.'},
{t:'choice',q:'Bạn vừa đọc xong một chương sách. Bạn làm gì tiếp?',o:['Đọc lại ngay lần nữa','Gập sách, tự viết ra những gì nhớ','Chuyển sang chương mới luôn'],a:1,e:'Tự truy xuất kiến thức khiến não củng cố trí nhớ mạnh hơn đọc lại.'},
{t:'info',x:'Ôn lại theo quãng cách: sau 1 ngày, 3 ngày, 7 ngày. Mỗi lần nhớ lại khó hơn một chút là dấu hiệu tốt.'}]},
{id:'b2',emo:'⚖️',title:'Tách sự thật khỏi cách mình diễn giải',topic:'Tư duy',cards:[
{t:'info',x:'Sự thật là điều quan sát được ("Anh ấy không trả lời tin nhắn"). Diễn giải là câu chuyện ta thêm vào ("Anh ấy ghét mình").'},
{t:'choice',q:'Bạn vừa mua một món đồ và tin đó là lựa chọn đúng. Tối đó bạn lên mạng đọc đánh giá. Bạn thường đọc kiểu nào?',o:['Tìm bài khen để yên tâm','Đọc cả khen lẫn chê','Bỏ qua bài chê, thấy khó chịu'],a:1,e:'Đọc cả hai phía giúp bạn thấy bức tranh thật, khó hơn nhưng chính xác hơn.'},
{t:'choice',q:'Đâu là một "sự thật"?',o:['Sếp đang bực mình với tôi','Sếp không chào tôi sáng nay','Sếp không tôn trọng tôi'],a:1,e:'Chỉ có câu thứ hai là điều quan sát được, hai câu kia là diễn giải.'}]},
{id:'b3',emo:'🌿',title:'Xây thói quen nhỏ mỗi ngày',topic:'Làm việc',cards:[
{t:'info',x:'Thói quen bền vững bắt đầu từ hành động rất nhỏ, gắn vào một việc bạn đã làm sẵn mỗi ngày.'},
{t:'fill',q:'Cách dễ nhất để bắt đầu thói quen mới là làm nó thật ___.',o:['lớn','nhỏ','phức tạp'],a:1,e:'Hành động nhỏ giảm ma sát, giúp bạn duy trì đều đặn.'},
{t:'choice',q:'Bạn muốn đọc sách mỗi ngày. Cách nào hợp lý nhất?',o:['Đọc 2 tiếng mỗi tối','Đọc 1 trang ngay sau khi đánh răng','Chờ khi nào có động lực'],a:1,e:'Gắn hành động nhỏ vào thói quen có sẵn là cách hiệu quả nhất.'}]}];
let S={view:'home',topic:'Tất cả',custom:LS.get('custom')||[],done:LS.get('done')||{},L:null,i:0,sel:null,coach:null};
S.habits=LS.get('habits')||[];S.fav=LS.get('fav')||[];S.rev=LS.get('rev')||{};S.revAt=LS.get('revAt')||{};const flat=()=>[...S.custom.flatMap(l=>l.parts?l.parts.flatMap(p=>p.lessons):[l]),...BASE];const all=flat;const msg=t=>{const e=$('#gm');if(e)e.textContent=t};
function go(v){S.view=v;render()}
function nav(){['home','gen','prog','habit','favs'].forEach((v,i)=>$('#n'+i).classList.toggle('on',v==S.view))}
function render(){nav();$('#nav')&&0;const f={home,gen,prog,habit,favs,favrev,lesson,coach,end,course}[S.view];$('#app').innerHTML=f();window.scrollTo(0,0);
document.querySelector('nav').style.display=['lesson','coach','end','course','favrev'].includes(S.view)?'none':'flex'}
function home(){const items=[...S.custom,...BASE],tp=['Tất cả',...new Set(items.map(l=>l.topic))];
const card=l=>{if(l.parts){const fl=l.parts.flatMap(p=>p.lessons),d=fl.filter(x=>S.done[x.id]).length;return `<div class="card les" onclick="openCourse('${l.id}')"><div class="emo">${esc(l.emo)}</div><div><b>${esc(l.title)}<span class="tag">Khoá</span></b><small>${d}/${fl.length} bài · ${esc(l.topic)}</small></div></div>`}
return `<div class="card les" onclick="start('${l.id}')"><div class="emo">${l.emo}</div><div><b>${esc(l.title)}${S.done[l.id]?'<span class="tag">✓ Xong</span>':''}</b><small>${l.cards.length} thẻ · ${esc(l.topic)}</small></div></div>`};
return `<h1>Xin chào! 👋</h1><div class="chips">${tp.map(t=>`<span class="chip ${t==S.topic?'on':''}" onclick="S.topic='${esc(t)}';render()">${esc(t)}</span>`).join('')}</div>
<button class="btn alt" style="margin:0 0 14px" onclick="go('gen')">➕ Tự tạo bài học từ video YouTube</button>
${items.filter(l=>S.topic=='Tất cả'||l.topic==S.topic).map(card).join('')}`}
function start(id,inC){S.C=inC?S.C:null;S.L=flat().find(l=>l.id==id);S.i=0;S.sel=null;S.view='lesson';render()}
function openCourse(id){S.C=S.custom.find(c=>c.id==id);S.view='course';render()}
function course(){const C=S.C,fl=C.parts.flatMap(p=>p.lessons),nx=fl.findIndex(l=>!S.done[l.id]);let k=-1;
return `<div class="top"><button class="x" onclick="S.C=null;go('home')">‹</button><b>${esc(C.title)}</b></div><p class="wh" style="opacity:.9">${esc(C.desc)}</p>${fl.some(l=>!l.img)?'<button class="btn alt" id="artb" onclick="genArt()">🎨 Tạo hình minh họa cho các bài</button><div id="artm" class="wh c" style="margin-top:6px"></div>':''}`+
C.parts.map((p,i)=>`<div class="card c"><small><b>PHẦN ${i+1}: ${esc(p.title.toUpperCase())}</b></small><div class="mut">${esc(p.desc)}</div></div>`+p.lessons.map(l=>{k++;const d=S.done[l.id],un=nx<0||k<=nx;return `<div class="card les" style="${un?'':'opacity:.55'}" onclick="${un?`start('${l.id}',1)`:''}">${emoBox(l,d,un)}<div><b>${esc(l.title)}</b><small>${l.brief?esc(l.brief)+' · ':''}${l.cards.length} thẻ</small></div></div>`}).join('')).join('')+
`<div style="position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));padding:0 16px;max-width:480px;margin:0 auto"><button class="btn" onclick="start('${(nx<0?fl[0]:fl[nx]).id}',1)">${nx<0?'Ôn lại từ đầu':nx==0?'Bắt đầu bài học':'Tiếp tục học'}</button></div><div style="height:70px"></div>`}
function lesson(){const L=S.L,c=L.cards[S.i],n=L.cards.length;
let h=`<div class="top"><button class="x" onclick="leave()">✕</button><b>${esc(L.title)}</b></div><div class="bar">${L.cards.map((_,k)=>`<i class="${k<=S.i?'on':''}"></i>`).join('')}</div><div class="card" style="position:relative"><button class="star" onclick="toggleFav()">${isFav()?'★':'☆'}</button>${L.img&&c.t=='sum'?imgTag(L.img,'width:100%;max-height:200px;object-fit:contain;border-radius:14px;background:#f6f4ff;margin-bottom:10px'):''}`;
if(c.t=='sum')h+=`<span class="tagq">📌 Tóm tắt bài</span><ul style="padding-left:20px;line-height:1.7;font-size:16px">${c.pts.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p class="mut">Tiếp theo là các thẻ nhỏ đi sâu từng ý.</p><button class="btn" onclick="next()">Bắt đầu đọc thẻ</button>`;else if(c.t=='info')h+=`<span class="tagq">Ghi nhớ</span>${c.h?`<b style="font-size:19px">${esc(c.h)}</b>`:''}<p style="line-height:1.6;font-size:17px">${esc(c.x)}</p><button class="btn" onclick="next()">Tiếp tục</button>`;
else{const ans=S.sel!==null;h+=`<span class="tagq">${c.t=='fill'?'Kéo để hoàn thành câu':'Bạn sẽ làm gì?'}</span><p style="line-height:1.6">${esc(c.q).replace('___',`<span class="blank">${ans?esc(c.o[c.a]):'&nbsp;'}</span>`)}</p>`+
c.o.map((o,k)=>`<button class="opt ${ans?(k==c.a?'good':k==S.sel?'bad':''):''}" ${ans?'disabled':''} onclick="pick(${k})">${esc(o)}</button>`).join('')+
(ans?`<div class="fb"><b>${S.sel==c.a?'Chính xác!':'Chưa đúng.'}</b> ${esc(c.e)}</div><button class="btn" onclick="next()">Tiếp tục</button>`:'')}
return h+'</div>'}
function pick(k){S.sel=k;const c=S.L.cards[S.i];S.L.score=(S.L.score||0)+(k==c.a?1:0);render()}
function next(){S.sel=null;if(S.i<S.L.cards.length-1){S.i++;render()}else{S.view='end';render()}}
function end(){return `<div class="top"><button class="x" onclick="finish()">✕</button></div><div class="card c" style="margin-top:40px"><div class="orb"><i></i><i></i></div><div class="bub" style="background:#f6f4ff">Bạn vừa học xong một phần, nói chút về nó nhé?</div><b>MeUp Coach <span class="tag">AI</span></b>
<button class="btn" onclick="startCoach()">Thực hành với Coach</button><button class="btn ghost" onclick="finish()">Bỏ qua, sang bài tiếp theo</button></div>`}
function finish(){const id=S.L.id;if(!S.done[id]){S.done[id]=Date.now();LS.set('done',S.done)}else{S.rev[id]=(S.rev[id]||0)+1;S.revAt[id]=Date.now();LS.set('rev',S.rev);LS.set('revAt',S.revAt)}leave()}function leave(){go(S.C?'course':'home')}
const valid=c=>(c.t=='info'&&c.x)||(c.t=='choice'&&Array.isArray(c.o)&&c.o.length>1&&Number.isInteger(c.a));
async function ai(p,max=3000){const k=LS.get('akey');if(!k)throw new Error('Chưa có khoá AI. Vào tab Tiến độ, mục "Khoá AI" để nhập.');
const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':k,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:LS.get('amodel')||'claude-sonnet-5',max_tokens:max,messages:[{role:'user',content:p}]})});
let d={};try{d=await r.json()}catch(e){}if(!r.ok)throw new Error((d.error&&d.error.message)||'Lỗi AI ('+r.status+')');return (d.content||[]).filter(b=>b.type=='text').map(b=>b.text).join('')}
async function aij(p,max){const t=await ai(p,max);return JSON.parse(t.slice(t.indexOf('{'),t.lastIndexOf('}')+1))}
async function buildCourse(link,raw){const t=raw.replace(/\b\d{1,2}:\d{2}(:\d{2})?\b/g,' ').replace(/\s+/g,' ').slice(0,30000);
const o=await aij(`Bạn là biên tập viên học liệu. Từ bản chép lời video dưới đây, bỏ lời dẫn, quảng cáo, phần lặp; chỉ giữ kiến thức cốt lõi. Chia thành khoá học tiếng Việt gồm 2-3 phần, mỗi phần 2-3 bài (tối đa 8 bài). Chỉ trả về JSON: {"title":"tiêu đề ngắn","desc":"1 câu mô tả","emo":"1 emoji","topic":"Học tập|Tư duy|Làm việc|Khám phá","parts":[{"title":"tên phần","desc":"1 câu","lessons":[{"title":"tên bài","emo":"1 emoji","focus":"ý chính của bài"}]}]}. Bản chép lời: ${t}`);
const ls=o.parts.flatMap(p=>p.lessons).slice(0,8);
for(let i=0;i<ls.length;i+=3)await Promise.all(ls.slice(i,i+3).map(async l=>{try{
const r=await aij(`Từ bản chép lời, viết bài tóm tắt "${l.title}" (trọng tâm: ${l.focus||''}) thuộc khoá "${o.title}". Chỉ dùng thông tin có trong video, không bịa. Tiếng Việt, dễ hiểu. Chỉ trả về JSON: {"brief":"1 câu tóm tắt bài","points":["3-4 ý chính, mỗi ý dưới 15 từ"],"cards":[4-5 thẻ {"t":"info","h":"tiêu đề 2-5 từ","x":"1-2 câu, tối đa 40 từ"}, rồi cuối cùng 1 thẻ {"t":"choice","q":"câu hỏi ôn","o":["A","B","C"],"a":0,"e":"giải thích ngắn"}]}. Bản chép lời: ${t}`);
l.brief=r.brief||'';const pts=(r.points||[]).filter(x=>typeof x=='string').slice(0,4);l.cards=(pts.length?[{t:'sum',pts}]:[]).concat((r.cards||[]).filter(valid));try{l.img=await makeArt(l)}catch(e){}}catch(e){l.cards=[]}}));
const id='c'+Date.now();let k=0;const parts=[];
for(const p of o.parts){const lsn=[];for(const l of p.lessons){if(l.cards&&l.cards.length)lsn.push({id:id+'_'+(k++),emo:l.emo||'📖',title:l.title,topic:o.topic||'Khám phá',brief:l.brief||'',img:l.img||'',cards:l.cards})}if(lsn.length)parts.push({title:p.title,desc:p.desc||'',lessons:lsn})}
if(!parts.length)throw new Error('Không tạo được bài học, hãy thử lại.');
return {id,emo:o.emo||'🎬',title:o.title,desc:o.desc||'',topic:o.topic||'Khám phá',src:link,parts}}
async function api(p,b){
if(p=='/api/questions')return aij(`Bạn là AI Coach thân thiện. Dựa trên nội dung bài học sau (JSON), tạo đúng 3 câu hỏi ôn tập ngắn bằng tiếng Việt, từ dễ đến vận dụng, để người học tự trả lời bằng lời của mình. Chỉ trả về JSON: {"questions":["...","...","..."]}. Bài học "${b.title}": ${JSON.stringify(b.cards)}`,800);
if(p=='/api/feedback')return {text:await ai(`Bạn là AI Coach động viên, ngắn gọn (tối đa 4 câu), tiếng Việt. Bài học: ${JSON.stringify(b.cards)}\nCâu hỏi: ${b.q}\nCâu trả lời của người học: ${b.a}\nHãy: 1) nhận xét đúng/thiếu, 2) bổ sung ý chính còn thiếu nếu có, 3) khen ngắn.`,600)};
if(p=='/api/course')return buildCourse(b.url,b.transcript);
throw new Error('Không hỗ trợ')}
async function startCoach(){S.view='coach';S.coach={log:[],qs:null,q:0,busy:true};render();
try{const r=await api('/api/questions',{title:S.L.title,cards:S.L.cards});S.coach.qs=r.questions.slice(0,3);S.coach.log.push({r:'ai',x:'Mình cùng ôn lại nhé! Câu 1: '+S.coach.qs[0]})}
catch(e){S.coach.qs=S.L.cards.filter(c=>c.q).map(c=>c.q.replace('___','...'));S.coach.log.push({r:'ai',x:'Chưa kết nối được AI, mình dùng câu hỏi có sẵn nhé. Câu 1: '+(S.coach.qs[0]||'Bạn nhớ được điều gì từ bài học?')})}
S.coach.busy=false;render()}
function coach(){const C=S.coach;const done=C.q>=C.qs?.length;
return `<div class="top"><button class="x" onclick="finish()">✕</button><b>MeUp Coach · Ôn luyện</b></div><div class="orb"><i></i><i></i></div>
${C.log.map(m=>`<div class="bub ${m.r=='me'?'me':''}">${esc(m.x)}</div>`).join('')}
${C.busy?'<div class="bub mut">Coach đang suy nghĩ…</div>':done?'<button class="btn" onclick="finish()">Hoàn thành bài học 🎉</button>':`<textarea id="ans" placeholder="Viết câu trả lời của bạn…"></textarea><button class="btn" onclick="answer()">Gửi cho Coach</button>`}`}
async function answer(){const C=S.coach,a=$('#ans').value.trim();if(!a)return;C.log.push({r:'me',x:a});C.busy=true;render();
const q=C.qs[C.q];let fb='Cảm ơn bạn đã trả lời! Hãy đối chiếu lại phần ghi nhớ của bài nhé.';
try{fb=(await api('/api/feedback',{cards:S.L.cards,q,a})).text}catch(e){}
C.log.push({r:'ai',x:fb});C.q++;
C.log.push({r:'ai',x:C.q<C.qs.length?`Câu ${C.q+1}: ${C.qs[C.q]}`:'Bạn đã hoàn thành phần ôn luyện. Tuyệt vời, cứ nhắc lại như vậy sau 1 ngày và 3 ngày để nhớ lâu nhé!'});C.busy=false;render()}
function gen(){return `<h1>Tạo khoá học từ video ▶️</h1><div class="card"><input id="yl" style="border:2px solid #e5e0ff" placeholder="🔗 Link YouTube (tuỳ chọn, để nhớ nguồn)">
<p class="mut">Mở video trên YouTube, bấm "…more", chọn "Hiện bản chép lời", sao chép toàn bộ rồi dán vào ô bên dưới.</p>
<textarea id="src" style="min-height:160px" placeholder="Dán bản chép lời của video vào đây…"></textarea><button class="btn" id="gb" onclick="makeCourse()">Tạo khoá học</button><div id="gm" class="mut c" style="margin-top:10px"></div></div>
<div class="card"><b>Cách hoạt động</b><p class="mut" style="line-height:1.6">1. Dán bản chép lời của video.<br>2. AI lọc kiến thức cốt lõi, chia thành phần và bài nhỏ.<br>3. Mỗi bài có thẻ tóm tắt, thẻ nhỏ để đọc, câu hỏi ôn và AI Coach.</p></div>`}
async function makeCourse(){const link=$('#yl').value.trim(),raw=$('#src').value.trim();if(raw.length<300)return msg('Hãy dán bản chép lời của video vào ô bên dưới.');
$('#gb').disabled=true;msg('AI đang viết bài… (30-90 giây)');
try{const o=await api('/api/course',{url:link,transcript:raw});S.custom.unshift(o);LS.set('custom',S.custom);openCourse(o.id)}
catch(e){const b=$('#gb');if(b)b.disabled=false;msg(e.message)}}
function prog0(){const d=Object.keys(S.done).length,days=new Set(Object.values(S.done).map(t=>new Date(t).toDateString())).size;
return `<h1>Tiến độ 📈</h1>${dueHtml()}<div class="card c"><div class="big">${d}/${all().length}</div><div class="mut">bài học đã hoàn thành</div></div><div class="card c"><div class="big">${days}</div><div class="mut">ngày đã học</div></div>
${all().map(l=>`<div class="card les" onclick="start('${l.id}')"><div class="emo">${l.emo}</div><div><b>${esc(l.title)}</b><small>${S.done[l.id]?'Đã học ngày '+new Date(S.done[l.id]).toLocaleDateString('vi-VN')+' · bấm để ôn lại':'Chưa học'}</small></div></div>`).join('')}`}
const IV=[1,3,7,14];
function due(){const now=Date.now();return flat().filter(l=>S.done[l.id]&&(S.rev[l.id]||0)<IV.length&&now-(S.revAt[l.id]||S.done[l.id])>=IV[S.rev[l.id]||0]*864e5)}
function dueHtml(){const d=due();return `<div class="card"><b>🔁 Cần ôn hôm nay</b>${d.length?d.map(l=>`<div class="les" style="margin-top:10px" onclick="review('${l.id}')"><div class="emo" style="width:44px;height:44px;font-size:24px">${esc(l.emo)}</div><div><b>${esc(l.title)}</b><small>Ôn lần ${(S.rev[l.id]||0)+1} với AI Coach</small></div></div>`).join(''):'<p class="mut" style="margin:8px 0 0">Chưa có bài nào đến hạn. Bài đã học sẽ được nhắc ôn sau 1, 3, 7 và 14 ngày.</p>'}</div>`}
function review(id){S.C=null;S.L=flat().find(l=>l.id==id);startCoach()}
const dk=(t=Date.now())=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function streak(h){let n=0,t=Date.now();if(!h.days[dk(t)])t-=864e5;while(h.days[dk(t)]){n++;t-=864e5}return n}
function habit(){const td=dk();return `<h1>Thói quen 🌱</h1><div class="card" style="display:flex;gap:8px"><input id="hn" placeholder="Thói quen mới, ví dụ: Đọc 1 trang sách" style="border:2px solid #e5e0ff"><button class="btn" style="width:auto;margin:0;padding:0 18px" onclick="addHabit()">+</button></div>`+(S.habits.length?S.habits.map(h=>`<div class="card"><div style="display:flex;align-items:center;gap:12px"><button class="emo" style="border:0;cursor:pointer;font-size:26px;background:${h.days[td]?'#d8f5e6':'#ece8ff'}" onclick="tick('${h.id}')">${h.days[td]?'✅':'⭕'}</button><div style="flex:1"><b>${esc(h.name)}</b><span class="mut" style="display:block;font-size:13px">🔥 ${streak(h)} ngày liên tiếp</span></div><button class="x" style="background:#f1eeff" onclick="delHabit('${h.id}')">✕</button></div><div style="display:flex;gap:6px;margin-top:10px">${[6,5,4,3,2,1,0].map(i=>`<i style="flex:1;height:8px;border-radius:9px;background:${h.days[dk(Date.now()-i*864e5)]?'var(--ok)':'#e5e0ff'}"></i>`).join('')}</div></div>`).join(''):'<div class="card c mut">Chưa có thói quen nào. Thêm một việc nhỏ để làm mỗi ngày.</div>')}
function saveH(){LS.set('habits',S.habits);render()}
function addHabit(){const v=$('#hn').value.trim();if(!v)return;S.habits.push({id:'h'+Date.now(),name:v,days:{}});saveH()}
function tick(id){const h=S.habits.find(x=>x.id==id),k=dk();if(h.days[k])delete h.days[k];else h.days[k]=1;saveH()}
function delHabit(id){S.habits=S.habits.filter(x=>x.id!=id);saveH()}

function backupHtml(){return `<div class="card"><b>💾 Sao lưu & khôi phục</b><p class="mut" style="margin:8px 0">Lưu khoá học, tiến độ và thói quen ra file để không mất khi đổi máy hoặc xoá dữ liệu Safari.</p><button class="btn" onclick="exportData()">Tải file sao lưu</button><button class="btn alt" onclick="showExport()">Hiện mã sao lưu để sao chép</button><textarea id="bk" style="margin-top:10px" placeholder="Dán mã sao lưu vào đây để khôi phục…"></textarea><button class="btn alt" onclick="importData()">Khôi phục từ mã</button><div id="bm" class="mut c" style="margin-top:8px"></div></div>`}
function keyHtml(){return `<div class="card"><b>🔑 Khoá AI</b><p class="mut" style="margin:8px 0">Dán khoá API của bạn (lấy tại console.anthropic.com). Khoá chỉ lưu trên máy này và chỉ được gửi tới Anthropic.</p><input id="ak" type="password" placeholder="sk-ant-..." value="${esc(LS.get('akey')||'')}" style="border:2px solid #e5e0ff"><button class="btn" onclick="saveKey()">Lưu khoá</button><div id="km" class="mut c" style="margin-top:8px">${LS.get('akey')?'Đã có khoá AI.':'Chưa có khoá.'}</div></div>`}
function saveKey(){const k=$('#ak').value.trim();LS.set('akey',k);$('#km').textContent=k?'Đã lưu khoá.':'Đã xoá khoá.'}
function prog(){return prog0()+keyHtml()+backupHtml()}
const bm=t=>{const e=$('#bm');if(e)e.textContent=t};
function pack(){return JSON.stringify({v:1,custom:S.custom,done:S.done,rev:S.rev,revAt:S.revAt,habits:S.habits,fav:S.fav})}
function showExport(){const t=$('#bk');t.value=pack();t.focus();t.select();bm('Nhấn giữ vào ô, chọn Chọn tất cả, Sao chép, rồi dán vào Ghi chú để cất giữ.')}
function importData(){try{const d=JSON.parse($('#bk').value.trim());if(d.v!==1||!Array.isArray(d.custom)||!Array.isArray(d.habits))throw 0;
S.custom=d.custom;S.done=d.done||{};S.rev=d.rev||{};S.revAt=d.revAt||{};S.habits=d.habits;S.fav=d.fav||[];LS.set('fav',S.fav);
LS.set('custom',S.custom);LS.set('done',S.done);LS.set('rev',S.rev);LS.set('revAt',S.revAt);LS.set('habits',S.habits);render();bm('Đã khôi phục dữ liệu.')}catch(e){bm('Mã sao lưu không hợp lệ. Hãy dán đúng toàn bộ mã.')}}
function exportData(){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([pack()],{type:'application/json'}));a.download='meup-backup-'+dk()+'.json';document.body.appendChild(a);a.click();a.remove();bm('Đã tạo file sao lưu. Nếu không thấy file, dùng nút "Hiện mã sao lưu".')}catch(e){showExport()}}

const imgTag=(svg,st)=>`<img alt="" style="${st}" src="data:image/svg+xml;utf8,${encodeURIComponent(svg)}">`;
function emoBox(l,d,un){if(!l.img)return `<div class="emo">${d?'✅':un?esc(l.emo):'🔒'}</div>`;
return `<div class="emo" style="padding:0;overflow:hidden;position:relative">${imgTag(l.img,'width:100%;height:100%;object-fit:cover')}${d?'<span style="position:absolute;right:2px;bottom:2px">✅</span>':!un?'<span style="position:absolute;inset:0;display:grid;place-items:center;background:rgba(255,255,255,.65)">🔒</span>':''}</div>`}
async function makeArt(l){const t=await ai(`Vẽ một hình minh họa SVG phẳng, đơn giản, dễ thương cho bài học "${l.title}" (${l.brief||''}). Yêu cầu: viewBox="0 0 200 200", nền bo tròn màu tím nhạt, dùng bảng màu tím #5b4be0, #a99cff, vàng #ffd23f và trắng; không có chữ; tối đa 25 phần tử; không dùng script hay ảnh ngoài. Chỉ trả về mã <svg>...</svg>, không giải thích.`,2000);
const m=t.match(/<svg[\s\S]*<\/svg>/i);if(!m)throw new Error('AI không trả về hình.');let sv=m[0].replace(/<script[\s\S]*?<\/script>/gi,'');if(!/xmlns=/.test(sv))sv=sv.replace('<svg','<svg xmlns="http://www.w3.org/2000/svg"');return sv}
async function genArt(){const ls=S.C.parts.flatMap(p=>p.lessons).filter(l=>!l.img),b=$('#artb');b.disabled=true;let n=0,err='';
for(let i=0;i<ls.length;i+=3)await Promise.all(ls.slice(i,i+3).map(async l=>{try{l.img=await makeArt(l);n++;$('#artm').textContent=`Đã vẽ ${n}/${ls.length}…`}catch(e){err=e.message;$('#artm').textContent=err}}));
LS.set('custom',S.custom);if(n)render();else b.disabled=false}
const fk=()=>S.L.id+'#'+S.i;
const isFav=()=>S.fav.some(f=>f.k==fk());
function toggleFav(){const k=fk(),ix=S.fav.findIndex(f=>f.k==k);if(ix>=0)S.fav.splice(ix,1);else S.fav.unshift({k,lt:S.L.title,c:S.L.cards[S.i]});LS.set('fav',S.fav);render()}
function favBody(c){if(c.t=='sum')return `<b>📌 Tóm tắt</b><ul style="padding-left:20px;line-height:1.6">${c.pts.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
if(c.t=='info')return `${c.h?`<b style="display:block;margin-top:6px">${esc(c.h)}</b>`:''}<p style="line-height:1.6">${esc(c.x)}</p>`;
return `<p style="line-height:1.6"><b>${esc(c.q)}</b></p><p style="color:var(--ok)">✔ ${esc(c.o[c.a])}</p><p class="mut">${esc(c.e||'')}</p>`}
function favs(){return `<h1>Thẻ đã lưu ⭐</h1>`+(S.fav.length?`<button class="btn" style="margin:0 0 14px" onclick="startFavRev()">🔀 Ôn ngẫu nhiên</button>`+S.fav.map((f,i)=>`<div class="card"><small class="mut">${esc(f.lt)}</small>${favBody(f.c)}<button class="btn ghost" style="margin:0" onclick="delFav(${i})">Bỏ lưu</button></div>`).join(''):'<div class="card c mut">Chưa có thẻ nào. Bấm ☆ ở góc thẻ khi học để lưu lại.</div>')}
function delFav(i){S.fav.splice(i,1);LS.set('fav',S.fav);render()}
function startFavRev(){S.fr=S.fav.map((_,i)=>i).sort(()=>Math.random()-.5);S.fp=0;S.view='favrev';render()}
function favrev(){const f=S.fav[S.fr[S.fp]];if(!f){S.view='favs';return favs()}
return `<div class="top"><button class="x" onclick="go('favs')">✕</button><b>Ôn thẻ đã lưu ${S.fp+1}/${S.fr.length}</b></div><div class="card" style="margin-top:16px"><small class="mut">${esc(f.lt)}</small>${favBody(f.c)}</div><button class="btn" onclick="S.fp++;S.fp>=S.fr.length?go('favs'):render()">${S.fp+1>=S.fr.length?'Xong':'Thẻ tiếp theo'}</button>`}
render();
</script></body></html>
